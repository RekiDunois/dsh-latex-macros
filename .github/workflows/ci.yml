## 验证提交的 `lib/` 与 `src/` 同步。仓库把构建产物入库，用户从 `github:` 地址安装时
## 拿到的就是这份文件，所以它过期就等于发布旧功能。

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11 --ignore-scripts
      - run: npm ci --ignore-scripts
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Committed lib/ must match a fresh build
        run: |
          if ! git diff --exit-code lib/; then
            echo "::error::lib/ is stale. Run 'npm run build' and commit lib/ with your src change."
            exit 1
          fi
      # src/katex-style.js is generated by the build and gitignored; keep it out of the check above.
